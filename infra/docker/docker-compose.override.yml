# =============================================================================
# Development Overrides — Exposes all service ports to host for debugging
# =============================================================================
# This file is auto-loaded by `docker compose up` (no -f flags needed).
# For production, skip this file:
#   docker compose -f docker-compose.yml up
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  redpanda:
    ports:
      - "9092:19092"   # Kafka API (external)
      - "18081:18081"  # Schema Registry
      - "18082:18082"  # HTTP Proxy
      - "9644:9644"    # Admin API

  # ---------------------------------------------------------------------------
  # Backend Services
  # ---------------------------------------------------------------------------
  api-server:
    ports:
      # Local Vite (5173/5174) needs direct BFF ports when gateway profile is off.
      # If you start the gateway profile (host :8081 for admin panel), stop this
      # mapping or stop the gateway — they cannot both own host :8081.
      - "8081:8081"   # user-bff (vite /api/user proxy)
      - "8083:8083"   # admin-bff
      - "8086:8091"   # payment-service
    environment:
      # Allow local Vite HMR origins for browser RC / make dev-frontend.
      ALLOWED_ORIGINS: "http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:8081,http://localhost:8081,http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174"
      USER_CORS_ALLOWED_ORIGINS: "http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:5173,http://localhost:5173"
      ADMIN_CORS_ALLOWED_ORIGINS: "http://127.0.0.1:8081,http://localhost:8081,http://127.0.0.1:5174,http://localhost:5174"
      USER_FRONTEND_ORIGIN: "http://localhost:5173"
      ADMIN_FRONTEND_ORIGIN: "http://localhost:5174"

  trading-core:
    ports:
      - "8082:8082"   # trade-bff (vite /api/trade proxy)
      - "8085:8082"   # trade-bff alias (legacy host mapping)
      - "8084:8084"   # market-ingestor
      - "8093:8085"   # trading-engine
    environment:
      ALLOWED_ORIGINS: "http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:5173,http://localhost:5173"
      TRADE_CORS_ALLOWED_ORIGINS: "http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:5173,http://localhost:5173"

  worker:
    ports:
      - "8094:8086"   # leaderboard-worker
      - "8095:8087"   # settlement-service
      - "8088:8088"   # contest-scheduler
      - "8091:8089"   # free-contest-generator

  # ---------------------------------------------------------------------------
  # Frontends — no source-mount overrides in dev: `make dev-frontend` runs
  # vite directly on 5173/5174 for HMR. The compose containers build
  # production bundles and are only relevant when exercising the gateway
  # path (e.g. full-stack integration tests).
  # ---------------------------------------------------------------------------

