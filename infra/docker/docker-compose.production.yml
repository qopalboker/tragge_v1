# =============================================================================
# TRAGGE — AUTHORITATIVE PRODUCTION COMPOSE (VM + Docker Engine)
# =============================================================================
#
# Kubernetes is NOT required for production. This file is the canonical
# production deployment overlay for Docker Compose on a production VM.
#
# Usage (from infra/docker):
#
#   # Self-contained production-like stack (deps in Compose):
#   docker compose -f docker-compose.yml -f docker-compose.production.yml \
#     --profile app --profile frontend up -d --build
#
#   # Prefer NOT loading docker-compose.override.yml (dev host port spam).
#   # On Linux production host, set TRAGGE_WAL_HOST_PATH to a dedicated
#   # block device mount (NOT the same disk as Postgres data if co-located).
#
# Non-negotiable:
#   - single trading-core container (never scale horizontally against same WAL)
#   - WAL on persistent host/block storage (bind mount), not container FS
#   - WAL_REQUIRE_PERSIST=true (fail-closed)
#   - dependencies private; only gateway (and intentional LB) public
#
# Profiles:
#   app      → api-server, trading-core, worker (+ infra from base)
#   frontend → gateway, user-frontend, admin-frontend
#
# External managed PostgreSQL/Redis/Redpanda:
#   Point POSTGRES_HOST / REDIS_ADDR / KAFKA_BROKERS via env and stop
#   local dependency containers after wiring (see production runbook).
# =============================================================================

name: tragge-prod

networks:
  platform_net:
    name: platform_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

# Production uses host/block bind for WAL (not a disposable named volume).
# Named volumes remain for local self-contained deps if run in-compose.
volumes:
  postgres_data:
  redis_data:
  redpanda_data:
  uploads_data:
  # trading_core_wal intentionally NOT used for production WAL path —
  # bind mount below is authoritative.

services:
  postgres:
    restart: unless-stopped
    # No host ports in production overlay (internal only)
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  redis:
    restart: unless-stopped
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  redpanda:
    restart: unless-stopped
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  api-server:
    restart: unless-stopped
    ports: !reset []
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_ENV: ${APP_ENV:-production}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-require}
      NOTIFICATION_ENABLED: ${NOTIFICATION_ENABLED:-true}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  # Single-active trading owner — do not scale this service.
  trading-core:
    restart: unless-stopped
    ports: !reset []
    # Production: dedicated host/block path only
    user: ${TRAGGE_TRADING_CORE_USER:-0:0}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_ENV: ${APP_ENV:-production}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-require}
      # Fail-closed durable WAL (mandatory in production)
      WAL_PERSIST_PATH: ${WAL_PERSIST_PATH:-/var/lib/tragge/wal/engine.jsonl}
      WAL_REQUIRE_PERSIST: "true"
      WAL_SYNC_ON_WRITE: ${WAL_SYNC_ON_WRITE:-true}
      REQUIRE_MARKET_DATA_READY: ${REQUIRE_MARKET_DATA_READY:-true}
      SHARD_ENABLED: ${SHARD_ENABLED:-false}
      SHARD_COUNT: "1"
      SHARD_ID: "0"
      # No mock market feed in production
      MARKET_PROVIDER: ${MARKET_PROVIDER:-massive}
    volumes:
      # Bind mount replaces named volume for production durability.
      # Host path MUST be a persistent block/filesystem mount.
      - type: bind
        source: ${TRAGGE_WAL_HOST_PATH:-/var/lib/tragge/wal}
        target: /var/lib/tragge/wal
        bind:
          create_host_path: true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
      # Compose deploy.replicas is swarm-only; document single instance in runbook.
      # Never start a second trading-core sharing this bind path.

  worker:
    restart: unless-stopped
    ports: !reset []
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_ENV: ${APP_ENV:-production}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-require}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  gateway:
    restart: unless-stopped
    # Public edge only — LB/TLS terminates in front when available
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:8080"
      - "${GATEWAY_ADMIN_PORT:-8081}:8081"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  user-frontend:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  admin-frontend:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
