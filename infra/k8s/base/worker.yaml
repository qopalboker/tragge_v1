apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: tragge
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: tragge-platform
spec:
  # Single replica: settlement uses PG advisory locks; scheduler needs single-owner calendar.
  # Do not scale worker horizontally without per-job lease redesign.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: tragge-platform
      annotations:
        tragge.io/settlement-authority: "true"
        tragge.io/scale: "manual-single"
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: worker
          image: tragge/worker:latest
          ports:
            - name: leaderboard
              containerPort: 8086
            - name: settlement
              containerPort: 8087
            - name: scheduler
              containerPort: 8088
            - name: generator
              containerPort: 8089
          envFrom:
            - configMapRef:
                name: tragge-config
          env:
            - name: DB_MAX_OPEN_CONNS
              value: "10"
            - name: DB_MAX_IDLE_CONNS
              value: "3"
            - name: GOGC
              value: "50"
            - name: GOMEMLIMIT
              value: "150MiB"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Liveness: process alive (leaderboard port always up in merged worker)
          livenessProbe:
            httpGet:
              path: /healthz
              port: leaderboard
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 5
          # Readiness: settlement path preferred for financial work admission
          readinessProbe:
            httpGet:
              path: /readyz
              port: settlement
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: tragge
  labels:
    app.kubernetes.io/name: worker
spec:
  selector:
    app.kubernetes.io/name: worker
  ports:
    - name: leaderboard
      port: 8086
      targetPort: 8086
    - name: settlement
      port: 8087
      targetPort: 8087
    - name: scheduler
      port: 8088
      targetPort: 8088
    - name: generator
      port: 8089
      targetPort: 8089
