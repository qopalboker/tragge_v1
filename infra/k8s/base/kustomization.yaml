apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: tragge-base

namespace: tragge

resources:
  # Namespace
  - namespace.yaml

  # Configuration
  - configmap.yaml
  - secrets.yaml

  # Infrastructure
  # PostgreSQL: single instance for staging/base; production overlay also includes
  # ./postgres-ha/ and deletes the single-instance StatefulSet/Service.
  - postgres.yaml
  - pgbouncer-config.yaml   # PgBouncer connection pooler configuration
  - pgbouncer-secrets.yaml  # PgBouncer authentication
  - pgbouncer.yaml          # PgBouncer deployment
  - redis.yaml
  - redpanda.yaml

  # Backend services (consolidated)
  # ARCH-008: base correctly deploys transitional wrappers until cutovers close.
  # Standalone package fates: docs/codex/reports/ARCH-008-standalone-fate.md
  # Overlay patches that name obsolete Deployments are INFRA-001/INFRA-002 drift,
  # not a license to delete apps/* source (no SAFE_TO_DELETE this cycle).
  - api-server.yaml       # embeds user-bff + admin-bff + payment-service (REPLACE packages)
  - trading-core.yaml     # embeds trading-engine + market-ingestor + trade-bff (KEEP/REPLACE)
  - worker.yaml           # embeds leaderboard + settlement + scheduler + generator

  # Frontend service (unified)
  - frontend.yaml

  # Gateway
  - gateway.yaml

  # Ingress and TLS
  - ingress.yaml
  - cluster-issuer.yaml
  - certificate.yaml

  # Autoscaling
  - hpa.yaml
  - prometheus-adapter-config.yaml

  # Pod Disruption Budgets
  - pdb.yaml

  # Network Policies (Zero-Trust Networking)
  - network-policies.yaml
  - redis-ha-network-policies.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/version: "1.0.0"
