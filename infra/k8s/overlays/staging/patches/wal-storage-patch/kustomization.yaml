# Staging WAL PVC storage class.
# Override STORAGE_CLASS when applying, or edit value for your cluster:
#   - kind / k3d: standard or local-path
#   - EKS: gp3 or ebs-sc
#   - production-like staging: premium-rwo (if provisioned)
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: "standard"
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: "10Gi"
    target:
      kind: StatefulSet
      name: trading-core
