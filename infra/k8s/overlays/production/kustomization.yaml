apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: tragge-production

# INFRA-002: desired-state production overlay.
# Patches ONLY resources that exist in infra/k8s/base.
# Not live-cluster parity proof — no production cluster assumed.
#
# NOTE: base/postgres-ha cannot be merged alongside base postgres/pgbouncer
# without ID conflicts (shared ConfigMap names). Tracked as
# INFRA002-POSTGRES-HA-OVERLAY.

namespace: tragge

resources:
  - ../../base

components:
  - patches/anti-affinity
  - patches/resources
  - patches/security-contexts
  - patches/storage

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: api-server

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: gateway

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: worker

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: frontend

  # trading-core remains single-active WAL owner
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: StatefulSet
      name: trading-core

  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
    target:
      kind: HorizontalPodAutoscaler
      name: api-server-hpa

  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
    target:
      kind: HorizontalPodAutoscaler
      name: gateway-hpa

  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: worker-hpa

  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: frontend-hpa

  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: tragge.io
      - op: replace
        path: /spec/rules/1/host
        value: api.tragge.io
      - op: replace
        path: /spec/rules/2/host
        value: ws.tragge.io
      - op: replace
        path: /spec/tls/0/hosts
        value:
          - tragge.io
          - api.tragge.io
          - ws.tragge.io
    target:
      kind: Ingress
      name: tragge-ingress

  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: ws.tragge.io
      - op: replace
        path: /spec/tls/0/hosts
        value:
          - ws.tragge.io
    target:
      kind: Ingress
      name: tragge-websocket-ingress

images:
  - name: tragge/api-server
    newTag: v1.0.0
  - name: tragge/trading-core
    newTag: v1.0.0
  - name: tragge/worker
    newTag: v1.0.0
  - name: tragge/frontend
    newTag: v1.0.0

labels:
  - pairs:
      environment: production
      managed-by: kustomize
    includeSelectors: false

commonAnnotations:
  deployment/environment: production
  deployment/managed-by: kustomize
  infra002/desired-state: "true"

configMapGenerator:
  - name: production-config
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - ENABLE_METRICS=true
      - ENABLE_TRACING=true
      - REDIS_MODE=sentinel
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - OTEL_SERVICE_NAME_PREFIX=prod-
      - GOOGLE_REDIRECT_URI=https://api.tragge.io/api/user/auth/google/callback
      - WAL_PERSIST_PATH=/var/lib/tragge/wal/engine.jsonl
      - WAL_REQUIRE_PERSIST=true
      - WAL_SYNC_ON_WRITE=true
      - REQUIRE_MARKET_DATA_READY=true
      - SHARD_ENABLED=false
