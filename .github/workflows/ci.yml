      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tragge/user-frontend lint
      - run: pnpm --filter @tragge/admin-frontend lint
      # CI-001: Vitest unit/component suites (must stay green).
      - name: Vitest (user-frontend)
        run: pnpm --filter @tragge/user-frontend test
      - name: Vitest (admin-frontend)
        run: pnpm --filter @tragge/admin-frontend test
      - run: pnpm --filter @tragge/user-frontend build
      - run: pnpm --filter @tragge/admin-frontend build
      # Playwright E2E is explicitly quarantined (not silently dropped):
